<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Anggota</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }

        button,
        a {
            padding: 13px 22px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            background: #e2e8f0;
            color: #334155;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>✏️ Edit Anggota</h1>

        <p class="subtitle">
            Perbarui data anggota ekstrakurikuler.
        </p>

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input
                        type="text"
                        name="nama"
                        value="{{ data['nama'] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>NIS</label>
                    <input
                        type="text"
                        name="nis"
                        value="{{ data['nis'] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Kelas</label>
                    <input
                        type="text"
                        name="kelas"
                        value="{{ data['kelas'] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Jenis Kelamin</label>

                    <select name="jenis_kelamin" required>
                        <option value="L"
                            {% if data['jenis_kelamin'] == 'L' %}selected{% endif %}>
                            Laki-laki
                        </option>

                        <option value="P"
                            {% if data['jenis_kelamin'] == 'P' %}selected{% endif %}>
                            Perempuan
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Ekstrakurikuler</label>

                    <select name="ekstrakurikuler" required>

                        {% for ekskul in [
                            'Futsal',
                            'Basket',
                            'Voli',
                            'Badminton',
                            'Pramuka',
                            'PMR',
                            'Paskibra',
                            'OSIS',
                            'Musik',
                            'Tari',
                            'Teater',
                            'Karya Ilmiah'
                        ] %}

                        <option value="{{ ekskul }}"
                            {% if data['ekstrakurikuler'] == ekskul %}selected{% endif %}>
                            {{ ekskul }}
                        </option>

                        {% endfor %}

                    </select>
                </div>

                <div class="form-group">
                    <label>Kategori</label>

                    <select name="kategori" required>

                        {% for kategori in [
                            'Olahraga',
                            'Seni',
                            'Organisasi',
                            'Akademik'
                        ] %}

                        <option value="{{ kategori }}"
                            {% if data['kategori'] == kategori %}selected{% endif %}>
                            {{ kategori }}
                        </option>

                        {% endfor %}

                    </select>
                </div>

                <div class="form-group full">
                    <label>No. HP</label>

                    <input
                        type="text"
                        name="no_hp"
                        value="{{ data['no_hp'] or '' }}"
                        placeholder="Contoh: 081234567890"
                    >
                </div>

            </div>

            <div class="buttons">

                <button type="submit">
                    💾 Simpan Perubahan
                </button>

                <a href="{{ url_for('index') }}" class="back">
                    ← Kembali
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
